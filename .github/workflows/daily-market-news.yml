name: Daily market news

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: validate
        options: [validate, send]

permissions: {contents: read}
concurrency: {group: daily-market-news, cancel-in-progress: false}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: scanner-jobs
    steps:
      - uses: actions/checkout@v5
        with:
          repository: kfirAdler/stock-scanner
          ref: c97bf84811a8c052e462321c467baa8968fa86c3
          token: ${{ secrets.PRIVATE_SCANNER_READ_TOKEN }}
          persist-credentials: false
          path: .private-src
          show-progress: false
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install report dependencies quietly
        working-directory: .private-src/services/scanner
        run: |
          if ! python -m pip install --disable-pip-version-check --quiet -r requirements-daily-news.txt >"${RUNNER_TEMP}/pip.log" 2>&1; then
            echo "Dependency installation failed; details withheld." >&2; exit 1
          fi
      - name: Validate module without network or sending
        if: inputs.mode == 'validate'
        working-directory: .private-src/services/scanner
        run: python -m py_compile run_daily_news.py && echo "Daily market news validated; nothing was sent."
      - name: Install private browser dependency quietly
        if: inputs.mode == 'send'
        working-directory: .private-src/services/scanner
        run: |
          if ! python -m playwright install --with-deps chromium >"${RUNNER_TEMP}/playwright.log" 2>&1; then
            echo "Browser dependency installation failed; details withheld." >&2; exit 1
          fi
      - name: Generate and send with output suppressed
        if: inputs.mode == 'send'
        working-directory: .private-src/services/scanner
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNEL_ID: ${{ secrets.DISCORD_NEWS_CHANNEL_ID }}
          DISCORD_NEWS_CHANNEL_NAME: ${{ vars.DISCORD_NEWS_CHANNEL_NAME || 'stock-news' }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_STATE_BACKEND: supabase
        run: |
          if ! python run_daily_news.py --send >"${RUNNER_TEMP}/daily-news.log" 2>&1; then
            echo "Daily market news failed; private output withheld." >&2; exit 1
          fi
          echo "Daily market news completed; private output withheld."
